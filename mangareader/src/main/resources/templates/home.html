<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Reader</title>
  <style>
    body { margin:0; background:#111; color:#eee; font-family:system-ui, sans-serif; }
    h1 { padding:20px 24px 0; margin:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px; padding:24px; }
    .card { background:#1b1b1f; border:1px solid #2c2c33; border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; }
    .card:hover { border-color:#ff6b35; }
    .card img, .sem-capa { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; }
    .sem-capa { display:flex; align-items:center; justify-content:center; background:#222; color:#777; }
    .card span { display:block; padding:10px; text-align:center; font-weight:600; }
  </style>
</head>
<body>
  <h1>Meus mangás</h1>
  <div class="grid">
    <a class="card" th:each="m : ${mangas}" th:href="@{/manga/{id}(id=${m.id()})}">
      <img th:if="${m.coverId() != null}" th:src="@{/img/{id}(id=${m.coverId()})}" th:alt="${m.name()}">
      <div class="sem-capa" th:unless="${m.coverId() != null}">Sem capa</div>
      <span th:text="${m.name()}">Nome</span>
    </a>
  </div>
</body>
</html>
