<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mangaNome} + ' - ' + ${capNome}">Leitor</title>
  <style>
    body { margin:0; background:#000; color:#eee; font-family:system-ui, sans-serif; }
    .topo { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#0c0c0e; border-bottom:1px solid #2c2c33; position:sticky; top:0; z-index:10; }
    .topo .titulo { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    a.btn { background:#1b1b1f; border:1px solid #2c2c33; border-radius:8px; padding:8px 14px; color:inherit; text-decoration:none; font-size:14px; }
    a.btn:hover { border-color:#ff6b35; }
    .paginas { max-width:900px; margin:0 auto; }
    .paginas img { display:block; width:100%; height:auto; min-height:300px; background:#1b1b1f; }
    .rodape { display:flex; justify-content:center; gap:12px; padding:32px 16px; }
    .vazio { text-align:center; padding:60px 16px; color:#9a9aa5; }
  </style>
</head>
<body>
  <div class="topo">
    <a class="btn" th:href="@{/manga/{id}(id=${mangaId})}">← Capítulos</a>
    <span class="titulo" th:text="${mangaNome} + ' - ' + ${capNome}">Título</span>
    <a class="btn" th:if="${anterior != null}" th:href="@{/manga/{m}/cap/{c}(m=${mangaId}, c=${anterior})}">⏮ Anterior</a>
    <a class="btn" th:if="${proximo != null}" th:href="@{/manga/{m}/cap/{c}(m=${mangaId}, c=${proximo})}">Próximo ⏭</a>
  </div>

  <div class="paginas">
    <img th:each="p : ${paginas}" th:src="@{/img/{id}(id=${p.id()})}" th:alt="${p.name()}" loading="lazy">
  </div>

  <p class="vazio" th:if="${#lists.isEmpty(paginas)}">Este capítulo não tem imagens.</p>

  <div class="rodape">
    <a class="btn" th:if="${anterior != null}" th:href="@{/manga/{m}/cap/{c}(m=${mangaId}, c=${anterior})}">⏮ Anterior</a>
    <a class="btn" th:href="@{/manga/{id}(id=${mangaId})}">Capítulos</a>
    <a class="btn" th:if="${proximo != null}" th:href="@{/manga/{m}/cap/{c}(m=${mangaId}, c=${proximo})}">Próximo ⏭</a>
  </div>
</body>
</html>
