spring.application.name=mangareader
spring.config.import=optional:classpath:application-local.properties

manga.api-key=${MANGA_API_KEY}
manga.root-folder-id=${MANGA_ROOT_FOLDER_ID}
app.login.user=${APP_LOGIN_USER}
app.login.password=${APP_LOGIN_PASSWORD}
server.port=${PORT:8080}
server.forward-headers-strategy=framework